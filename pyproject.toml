[build-system]
requires = [
    "setuptools==72.1.0",
    "wheel==0.44.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "trace-esus"
version = "0.1.0"
description = "Reproducible TRACE-ESUS causal-endotyping experiments"
requires-python = "==3.12.0"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
trace-esus = "run:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "configs*",
    "traceesus*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
